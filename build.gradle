// Top-level build file for Kotlin migration
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url 'https://dl.bintray.com/bertrandmartel/maven/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23'
        classpath 'fr.bmartel:gradle-javacard:1.5.2'
        // Coveralls plugin removed - can be added later if needed for CI
    }
}

plugins {
    id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://github.com/omadahealth/omada-nexus/raw/master/release" }
        maven { url 'https://dl.bintray.com/bertrandmartel/maven/' }
    }
}

// Java 11 configuration (AGP 7.4.2 works with Java 11)

// Jacoco configuration removed - applet module excluded from main build

// Clean task
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
